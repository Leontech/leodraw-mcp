name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/mcp ./internal/geom ./internal/colors
      - name: Vet
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build (Windows x64)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o leodraw-mcp.exe ./cmd/leodraw-mcp
